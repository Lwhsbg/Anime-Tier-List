<!DOCTYPE html>
<html>
    <head>
        <title>Anime Tier List</title>
        <link rel = "stylesheet" href = "style.css">
    </head>

        <h1>Anime Tier List</h1>
        <p class = "intro">Drag animes into your tiers.</p>

            <div class = "tier">
                <div class = "label s">S</div>

        </div>
        <div class = "tier">
            <div class = "label b">B</div>
            <div class = "drop-zone"></div>
        </div>
        <div class = "tier">
            <div class = "label c">C</div>
            <div class = "drop-zone"></div>
        </div>
        <div class = "tier">
            <div class = "label d">D</div>
            <div class = "drop-zone"></div>
        </div>
        <div class = "tier">
            <div class = "label e">E</div>
            <div class = "drop-zone"></div>
        </div>
        <div class = "tier">
            <div class = "label f">F</div>
            <div class = "drop-zone"></div>
        </div>
        
    </body>
</html>
